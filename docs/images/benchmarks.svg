<svg xmlns="http://www.w3.org/2000/svg" width="760" height="326" viewBox="0 0 760 326" role="img" aria-label="Bar chart on a log scale: create to first command takes 26.4 ms with a warm pool and 234 ms cold">
<g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
<rect width="760" height="326" fill="#151515"/>
<rect x="0.5" y="0.5" width="759" height="325" fill="none" stroke="#3a3835"/>
<text x="32" y="34" font-size="13" fill="#8f8b84">measured latency, medians, log scale (lower is better)</text>
<line x1="282.0" y1="56" x2="282.0" y2="262" stroke="#3a3835"/>
<text x="282.0" y="282" font-size="12" fill="#8f8b84" text-anchor="middle">1 ms</text>
<line x1="404.0" y1="56" x2="404.0" y2="262" stroke="#3a3835"/>
<text x="404.0" y="282" font-size="12" fill="#8f8b84" text-anchor="middle">10 ms</text>
<line x1="526.0" y1="56" x2="526.0" y2="262" stroke="#3a3835"/>
<text x="526.0" y="282" font-size="12" fill="#8f8b84" text-anchor="middle">100 ms</text>
<line x1="648.0" y1="56" x2="648.0" y2="262" stroke="#3a3835"/>
<text x="648.0" y="282" font-size="12" fill="#8f8b84" text-anchor="middle">1000 ms</text>
<text x="32" y="82" font-size="13" fill="#ece9e3">create to first command, warm pool</text>
<rect x="282" y="70" width="173.4" height="16" fill="#8fa3e8"/>
<text x="728" y="83" font-size="13" fill="#ece9e3" text-anchor="end">26.4 ms</text>
<text x="32" y="122" font-size="13" fill="#b9b5ad">create to first command, cold</text>
<rect x="282" y="110" width="289.0" height="16" fill="#b9b5ad"/>
<text x="728" y="123" font-size="13" fill="#ece9e3" text-anchor="end">234 ms</text>
<text x="32" y="162" font-size="13" fill="#b9b5ad">resume a snapshot</text>
<rect x="282" y="150" width="136.4" height="16" fill="#b9b5ad"/>
<text x="728" y="163" font-size="13" fill="#ece9e3" text-anchor="end">13.1 ms</text>
<text x="32" y="202" font-size="13" fill="#b9b5ad">first command after a resume</text>
<rect x="282" y="190" width="97.2" height="16" fill="#b9b5ad"/>
<text x="728" y="203" font-size="13" fill="#ece9e3" text-anchor="end">6.3 ms</text>
<text x="32" y="242" font-size="13" fill="#b9b5ad">command in a running sandbox</text>
<rect x="282" y="230" width="29.8" height="16" fill="#b9b5ad"/>
<text x="728" y="243" font-size="13" fill="#ece9e3" text-anchor="end">1.8 ms</text>
<text x="32" y="312" font-size="11" fill="#8f8b84">one shared i9-13900K box, n=20 per metric; sources: examples/benchmark-suite/results/</text>
</g>
</svg>
