<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">sandkiln architecture</title>
  <desc id="d">Clients (JS/TS SDK, Python SDK, kiln CLI, raw HTTP) call the sandkilnd HTTP API. The daemon uses the vmm crate to drive Firecracker microVMs, each with a guest agent reached over vsock. Sandboxes get a tap device on a shared bridge with NAT and egress policy. Snapshots, drives and history live on the host.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#768390"/></marker>
    <style>
      .box{fill:#768390;fill-opacity:.12;stroke:#768390;stroke-width:1.5}
      .acc{fill:#d9822b;fill-opacity:.16;stroke:#d9822b;stroke-width:2}
      .vm{fill:#4a90d9;fill-opacity:.10;stroke:#4a90d9;stroke-width:2;stroke-dasharray:7 4}
      .h{font-size:15px;font-weight:700;fill:#768390}
      .s{font-size:12px;fill:#768390}
      .l{stroke:#768390;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <text x="450" y="24" text-anchor="middle" class="h" font-size="17">Clients</text>
  <g class="box"><rect x="40" y="36" width="190" height="52" rx="8"/><rect x="250" y="36" width="190" height="52" rx="8"/><rect x="460" y="36" width="190" height="52" rx="8"/><rect x="670" y="36" width="190" height="52" rx="8"/></g>
  <g text-anchor="middle"><text x="135" y="59" class="h">JS/TS SDK</text><text x="135" y="77" class="s">npm: sandkiln</text>
  <text x="345" y="59" class="h">Python SDK</text><text x="345" y="77" class="s">PyPI: sandkiln</text>
  <text x="555" y="59" class="h">kiln CLI</text><text x="555" y="77" class="s">npm: sandkiln-cli</text>
  <text x="765" y="59" class="h">curl / any HTTP client</text><text x="765" y="77" class="s">bearer token</text></g>
  <path class="l" marker-end="url(#a)" d="M450 92V128"/>
  <text x="462" y="115" class="s">HTTP + WebSocket</text>

  <rect class="acc" x="40" y="130" width="820" height="112" rx="10"/>
  <text x="60" y="154" class="h">sandkilnd (daemon, axum HTTP API, runs unprivileged)</text>
  <g class="box"><rect x="60" y="168" width="150" height="56" rx="6"/><rect x="224" y="168" width="150" height="56" rx="6"/><rect x="388" y="168" width="150" height="56" rx="6"/><rect x="552" y="168" width="150" height="56" rx="6"/><rect x="716" y="168" width="124" height="56" rx="6"/></g>
  <g text-anchor="middle" class="s"><text x="135" y="192">sandboxes, exec,</text><text x="135" y="208">files, PTY, streams</text>
  <text x="299" y="192">snapshots, pools,</text><text x="299" y="208">drives, images</text>
  <text x="463" y="192">preview proxy,</text><text x="463" y="208">tunnels, mounts</text>
  <text x="627" y="192">idle reaper,</text><text x="627" y="208">auth, request ids</text>
  <text x="778" y="192">/metrics</text><text x="778" y="208">/status</text></g>

  <path class="l" marker-end="url(#a)" d="M300 244V282"/>
  <path class="l" marker-end="url(#a)" d="M700 244V282"/>
  <rect class="box" x="40" y="284" width="500" height="64" rx="8"/>
  <text x="60" y="308" class="h">vmm crate (host side)</text>
  <text x="60" y="328" class="s">spawns Firecracker, reflink rootfs clone, snapshot/resume, tap lease, egress rules</text>
  <rect class="box" x="580" y="284" width="280" height="64" rx="8"/>
  <text x="600" y="308" class="h">store crate (sqlite, WAL)</text>
  <text x="600" y="328" class="s">durable sandbox-lifecycle history</text>

  <path class="l" marker-end="url(#a)" d="M200 350V390"/>
  <text x="212" y="376" class="s">API socket</text>

  <rect class="vm" x="40" y="392" width="500" height="148" rx="12"/>
  <text x="60" y="416" class="h">Firecracker microVM (KVM, one per sandbox)</text>
  <g class="box"><rect x="60" y="430" width="140" height="92" rx="6"/><rect x="230" y="430" width="290" height="92" rx="6"/></g>
  <text x="130" y="470" text-anchor="middle" class="h">guest kernel</text>
  <text x="130" y="490" text-anchor="middle" class="s">own rootfs and NIC</text>
  <text x="375" y="458" text-anchor="middle" class="h">guest-agent (static musl)</text>
  <text x="375" y="478" text-anchor="middle" class="s">exec, files, PTY, mounts</text>
  <text x="375" y="496" text-anchor="middle" class="s">framed protocol crate shared with host</text>
  <path class="l" marker-start="url(#a)" marker-end="url(#a)" d="M400 392V350"/>
  <text x="412" y="376" class="s">vsock</text>

  <g>
    <rect class="box" x="580" y="392" width="280" height="62" rx="8"/>
    <text x="720" y="416" text-anchor="middle" class="h">tap pool, shared bridge</text>
    <text x="720" y="436" text-anchor="middle" class="s">port isolation, NAT, iptables egress policy</text>
    <rect class="box" x="580" y="470" width="280" height="70" rx="8"/>
    <text x="720" y="494" text-anchor="middle" class="h">Host disk</text>
    <text x="720" y="514" text-anchor="middle" class="s">snapshots, drives, images, rootfs clones</text>
  </g>
  <path class="l" marker-end="url(#a)" d="M540 430H578"/>
  <path class="l" marker-end="url(#a)" d="M540 500H578"/>
</svg>
