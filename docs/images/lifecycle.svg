<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sandbox lifecycle</title>
  <desc id="d">A sandbox is created, runs commands, can be snapshotted, and a snapshot can be resumed, forked, or restored from history into a new sandbox. Stop keeps a resumable snapshot by default.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#768390"/></marker>
    <style>
      .box{fill:#768390;fill-opacity:.12;stroke:#768390;stroke-width:1.5}
      .acc{fill:#d9822b;fill-opacity:.16;stroke:#d9822b;stroke-width:2}
      .blu{fill:#4a90d9;fill-opacity:.12;stroke:#4a90d9;stroke-width:2}
      .h{font-size:15px;font-weight:700;fill:#768390}
      .s{font-size:12px;fill:#768390}
      .l{stroke:#768390;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <g text-anchor="middle">
    <rect class="box" x="30" y="40" width="130" height="64" rx="8"/><text x="95" y="68" class="h">create</text><text x="95" y="88" class="s">POST /sandboxes</text>
    <rect class="acc" x="215" y="40" width="130" height="64" rx="8"/><text x="280" y="68" class="h">running</text><text x="280" y="88" class="s">exec, files, PTY</text>
    <rect class="box" x="400" y="40" width="130" height="64" rx="8"/><text x="465" y="68" class="h">snapshot</text><text x="465" y="88" class="s">memory + state + disk</text>
    <rect class="box" x="585" y="40" width="130" height="64" rx="8"/><text x="650" y="68" class="h">stopped</text><text x="650" y="88" class="s">resumable by default</text>
    <rect class="box" x="770" y="40" width="100" height="64" rx="8"/><text x="820" y="68" class="h">deleted</text><text x="820" y="88" class="s">keep=false</text>
  </g>
  <path class="l" marker-end="url(#a)" d="M160 72H213"/>
  <path class="l" marker-end="url(#a)" d="M345 72H398"/>
  <path class="l" marker-end="url(#a)" d="M530 72H583"/>
  <path class="l" marker-end="url(#a)" d="M715 72H768"/>
  <text x="650" y="136" text-anchor="middle" class="s">stop() keeps a snapshot unless asked not to</text>

  <g text-anchor="middle">
    <rect class="blu" x="100" y="210" width="200" height="70" rx="8"/><text x="200" y="238" class="h">resume</text><text x="200" y="258" class="s">consumes the record</text>
    <rect class="blu" x="350" y="210" width="200" height="70" rx="8"/><text x="450" y="238" class="h">fork</text><text x="450" y="258" class="s">new sandbox, snapshot kept</text>
    <rect class="blu" x="600" y="210" width="200" height="70" rx="8"/><text x="700" y="238" class="h">time-travel restore</text><text x="700" y="258" class="s">any retired checkpoint, repeatable</text>
  </g>
  <path class="l" d="M465 108V160H200V208" marker-end="url(#a)"/>
  <path class="l" d="M465 160H450V208" marker-end="url(#a)"/>
  <path class="l" d="M465 160H700V208" marker-end="url(#a)"/>
  <text x="450" y="312" text-anchor="middle" class="s">each one boots a new running sandbox</text>
</svg>
