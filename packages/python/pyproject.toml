[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandkiln"
version = "0.1.0"
description = "Client SDK for sandkiln: hardware-isolated Firecracker microVM sandboxes for running untrusted code."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sumit Kumar" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["sandbox", "firecracker", "microvm", "isolation", "untrusted-code", "vm"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/SumitKumar-17/sandkiln"
Repository = "https://github.com/SumitKumar-17/sandkiln"
Issues = "https://github.com/SumitKumar-17/sandkiln/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sandkiln"]
