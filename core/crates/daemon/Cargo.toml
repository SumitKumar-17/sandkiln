[package]
name = "sandkiln-daemon"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[[bin]]
name = "sandkilnd"
path = "src/main.rs"

[dependencies]
sandkiln-protocol = { path = "../protocol" }
sandkiln-vmm = { path = "../vmm" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.5", features = ["trace"] }
uuid = { version = "1", features = ["v4"] }
caps = "0.5"
# Already implicit in the dependency tree via axum 0.7 (which is built on
# hyper 1.x); these just turn on the client side of what's already there
# for the /preview reverse proxy, rather than pulling in a whole separate
# HTTP client stack (e.g. reqwest) for one internal hop to a guest's own
# port on the bridge network.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
