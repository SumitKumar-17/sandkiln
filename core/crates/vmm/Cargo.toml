[package]
name = "sandkiln-vmm"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
sandkiln-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
base64 = "0.22"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vm_lifecycle"
harness = false
