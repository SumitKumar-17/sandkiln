[package]
name = "sandkiln-store"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
# "bundled" compiles sqlite from source as part of this crate rather than
# needing libsqlite3-dev on the host -- consistent with this project's
# "clone and build" self-hosting story (see root AGENTS.md), no new
# system package to document in SELF_HOSTING.md.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
