name: Publish MCP server to npm

# Deliberately not triggered on every push to main: publishing a version is
# permanent, so it only runs on a manual dispatch or a tag like
# `mcp-v0.1.0`. Mirrors publish-cli.yml (same one-time NPM_TOKEN setup). The
# `sandkiln` dependency must already be published at the version this
# package pins, because npm installs it from the registry for end users.
on:
  workflow_dispatch:
  push:
    tags:
      - "mcp-v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w sandkiln
      - run: npm run build -w sandkiln
      - run: npm run typecheck -w sandkiln-mcp
      - run: npm run build -w sandkiln-mcp
      - run: npm run test -w sandkiln-mcp
      - name: Verify package.json version matches the tag
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mcp-v}"
          PKG_VERSION="$(node -p "require('./packages/mcp/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag mcp-v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - name: Verify the pinned sandkiln version is on the registry
        run: |
          DEP="$(node -p "require('./packages/mcp/package.json').dependencies.sandkiln")"
          npm view "sandkiln@$DEP" version
      - run: npm publish --workspace sandkiln-mcp --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
