name: Publish SDK to npm

# Deliberately not triggered on every push to main — publishing a version
# is permanent, so it only runs when someone explicitly asks for it:
# either a manual dispatch, or pushing a tag like `sdk-v0.2.0`.
#
# Setup required once: create an npm "Automation" access token (npmjs.com
# → Access Tokens → Generate New Token → Automation — this type is
# designed to bypass the 2FA-on-publish requirement for CI use) and add
# it as a repository secret named NPM_TOKEN.
on:
  workflow_dispatch:
  push:
    tags:
      - "sdk-v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w sandkiln
      - run: npm run build -w sandkiln
      - name: Verify package.json version matches the tag
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag sdk-v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - run: npm publish --workspace sandkiln --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
