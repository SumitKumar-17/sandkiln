name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/configure-pages@v5
      # GitHub Pages serves this as a project page (a subpath, not the domain
      # root), so ASTRO_BASE drives asset/link paths instead of being
      # hardcoded — see website/astro.config.mjs. Docs are a separate
      # Mintlify project (docs-site/) deployed independently; nothing here
      # touches them.
      - name: Build site
        working-directory: website
        run: |
          npm ci
          npm run build
        env:
          ASTRO_BASE: /sandkiln
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@v4
