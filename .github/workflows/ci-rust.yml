name: CI (Rust)

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/ci-rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/ci-rust.yml"

jobs:
  rust:
    name: Rust workspace (build + clippy)
    runs-on: ubuntu-latest
    # KVM isn't available on standard GitHub-hosted runners, so this
    # covers compilation and lints only — not booting a real microVM.
    # See AGENTS.md for how VM-level changes actually get verified.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build
        run: cargo build --workspace --all-targets
        working-directory: core
      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: core
      - name: Test
        run: cargo test --workspace
        working-directory: core
