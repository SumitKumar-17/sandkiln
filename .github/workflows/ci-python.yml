name: CI (Python)

on:
  push:
    branches: [main]
    paths:
      - "packages/python/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/python/**"
      - ".github/workflows/ci-python.yml"

jobs:
  python:
    name: Python SDK (build + import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
        working-directory: packages/python
      - run: pip install .
        working-directory: packages/python
      - run: python -c "import sandkiln; sandkiln.Sandbox; sandkiln.SandkilnApiError"
